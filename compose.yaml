# Production-style local deployment: one service (API + web app) with a persistent volume.
#   docker compose up -d --build      → http://localhost:8787
#   docker compose run --rm tests     → unit / integration test suites inside the image
services:
  sweep:
    build:
      context: .
      target: runtime
    image: sweep:latest
    ports:
      - "${SWEEP_PORT:-8787}:8787"
    env_file:
      - path: .env
        required: false
    environment:
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - sweep-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  tests:
    build:
      context: .
      target: test
    profiles: ["test"]

volumes:
  sweep-data:
